<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schulplaner</title>
<style>
:root{--bg:#fff7ed;--card:#ffffff;--tx:#2b2142;--mu:#7a6f94;--ac:#7c3aed;--bd:#eadcff;--no:#ef4444;--te:#f97316;--sh:0 4px 14px rgba(124,58,237,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#1a1530;--card:#261f45;--tx:#f3eeff;--mu:#b9addb;--ac:#a78bfa;--bd:#3d3470;--sh:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}h1{font-size:1.35rem;margin:0}h2{font-size:1.05rem;margin:20px 0 8px}
.top{background:linear-gradient(135deg,#7c3aed,#ec4899 60%,#f97316);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--sh)}
.top button{background:rgba(255,255,255,.25);color:#fff;border-color:transparent}
.hero{background:linear-gradient(135deg,#fde68a,#fbcfe8);color:#4a1d6a;border-radius:18px;padding:14px;margin:8px 0;box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0;box-shadow:var(--sh)}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:9px 12px}
button{cursor:pointer}button.p{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border:0;font-weight:600}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto;padding-bottom:4px}.tabs button{white-space:nowrap;border-radius:99px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 120px}
.lesson{display:flex;gap:10px}.nr{min-width:28px;font-weight:700;color:var(--mu)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;color:#fff;display:inline-block;margin-right:6px}
.ha{background:#7c3aed}.test{background:#f97316}.ka{background:#ef4444}.mu{color:var(--mu);font-size:.9rem}
.it{margin-top:6px}.chk{font-size:.9rem;color:var(--mu);cursor:pointer}.dn{text-decoration:line-through;opacity:.55}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{border:1px solid var(--bd);padding:4px}td input{width:100%;min-width:70px;border:0;background:transparent;padding:4px}
.x{background:none;border:0;color:var(--no);padding:0 4px}.ph{max-width:140px;max-height:120px;border-radius:10px;margin:4px 4px 0 0}
#ml{max-height:50vh;overflow-y:auto}.msg{padding:6px 0;border-bottom:1px solid var(--bd)}.err{color:var(--no)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
</head>
<body>
<main id="app"></main>
<script>
/* >>> HIER DEINE SUPABASE-DATEN EINTRAGEN <<< */
const SB_URL="https://rzofbhdwtkerkwhxqqgq.supabase.co",SB_KEY="sb_publishable_w04CQB6mujalBzs8fXVmLA_ZYUfyi1K";
const sb=supabase.createClient(SB_URL,SB_KEY),B="loesungen";
const DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"],LBL={ha:"Hausaufgabe",test:"Test",ka:"Klassenarbeit"};
const ROLES={admin:"Admin (alles)",ha:"Hausaufgaben eintragen",test:"Hausaufgaben, Tests & Klassenarbeiten",read:"Nur lesen"};
let me=null,done=new Set(),tt=DAYS.map(()=>Array(8).fill("")),items=[],sols=[],users=[],msgs=[],tab="morgen",edit=false,date=nextSchoolDay(),err="";
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function nextSchoolDay(){const d=new Date();d.setDate(d.getDate()+1);while(d.getDay()==0||d.getDay()==6)d.setDate(d.getDate()+1);return iso(d)}
const wd=s=>(new Date(s+"T12:00:00").getDay()+6)%7,fmt=s=>s.split("-").reverse().join(".");
const slug=n=>(n.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"")||"x");
const url=p=>sb.storage.from(B).getPublicUrl(p).data.publicUrl;
const role=()=>me?me.role:"read",isA=()=>role()=="admin";
const can=t=>isA()||role()=="test"||(role()=="ha"&&t=="ha");
async function init(){const{data}=await sb.auth.getSession();if(data.session)await start();else render()}
async function start(){const{data:{user}}=await sb.auth.getUser();const{data:p}=await sb.from("profiles").select("*").eq("id",user.id).single();me=p;await loadAll();render();setInterval(pollChat,5000)}
async function loadAll(){const[a,b,c,d,e,f]=await Promise.all([sb.from("timetable").select("*"),sb.from("items").select("*").order("id"),sb.from("solutions").select("*").order("id"),sb.from("profiles").select("*").order("name"),sb.from("messages").select("*").order("id",{ascending:false}).limit(100),sb.from("done").select("item_id")]);
 tt=DAYS.map(()=>Array(8).fill(""));(a.data||[]).forEach(r=>{if(tt[r.day])tt[r.day][r.lesson]=r.subject});items=b.data||[];done=new Set((f.data||[]).map(r=>r.item_id));sols=c.data||[];users=d.data||[];msgs=(e.data||[]).reverse()}
async function auth(neu){const n=$("nm").value.trim(),p=$("pw").value;if(!n||p.length<6){err="Bitte Name und ein Passwort mit mindestens 6 Zeichen eingeben.";return render()}
 const email=slug(n)+"@klasse.local",r=neu?await sb.auth.signUp({email,password:p,options:{data:{name:n}}}):await sb.auth.signInWithPassword({email,password:p});
 if(r.error){err=r.error.message;return render()}
 if(!r.data.session){err="Registriert, aber noch keine Sitzung: In Supabase die E-Mail-Bestätigung ausschalten.";return render()}
 err="";await start()}
async function logout(){await sb.auth.signOut();location.reload()}
function shift(n){const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+n);date=iso(d);render()}
function subs(d){const u=[...new Set((d<5?tt[d]:tt.flat()).filter(Boolean))];return u.length?u:[...new Set(tt.flat().filter(Boolean))]}
async function addItem(){const type=$("typ").value;if(!can(type))return;const tx=$("txt").value.trim();if(!tx)return;
 const r=await sb.from("items").insert({date,subject:$("sub").value,type,text:tx,by_name:me.name});if(r.error)return alert(r.error.message);await loadAll();render()}
async function delItem(id){await sb.from("items").delete().eq("id",id);await loadAll();render()}
async function delSol(id,p){await sb.storage.from(B).remove([p]);await sb.from("solutions").delete().eq("id",id);await loadAll();render()}
async function importVp(){const k=$("kl").value.trim();if(!k)return alert("Bitte die Klasse eintragen, z. B. 8a.");try{localStorage.setItem("klasse",k)}catch(e){}
 const r=await sb.functions.invoke("stundenplan-import",{body:{klasse:k}});
 if(r.error){let m=r.error.message;try{const j=await r.error.context.json();m=j.error||m}catch(e){}return alert("Import hat nicht geklappt: "+m)}
 await loadAll();render();alert("Stundenplan übernommen ("+r.data.tage+" Tage).")}
async function setCell(d,l,v){await sb.from("timetable").upsert({day:d,lesson:l,subject:v.trim()});tt[d][l]=v.trim()}
async function setRole(id,r){await sb.from("profiles").update({role:r}).eq("id",id);await loadAll();render()}
function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.8)};im.src=URL.createObjectURL(f)})}
async function addPhoto(id,f){if(!f)return;const b=await shrink(f),p=id+"/"+Date.now()+".jpg",u=await sb.storage.from(B).upload(p,b,{contentType:"image/jpeg"});if(u.error)return alert(u.error.message);
 await sb.from("solutions").insert({item_id:id,path:p,by_name:me.name});await loadAll();render()}
async function send(){const t=$("ct").value.trim();if(!t)return;$("ct").value="";await sb.from("messages").insert({text:t,by_name:me.name});await pollChat(true)}
async function delMsg(id){await sb.from("messages").delete().eq("id",id);await pollChat(true)}
async function pollChat(f){if(!me||(tab!="chat"&&!f))return;const{data}=await sb.from("messages").select("*").order("id",{ascending:false}).limit(100);msgs=(data||[]).reverse();if(tab=="chat")chatList()}
function chatList(){const e=$("ml");if(!e)return;const b=e.scrollTop+e.clientHeight>=e.scrollHeight-40;
 e.innerHTML=msgs.map(m=>`<div class="msg"><b>${esc(m.by_name)}</b> <span class="mu">${new Date(m.created_at).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span>${isA()?` <button class="x" onclick="delMsg(${m.id})">✕</button>`:""}<br>${esc(m.text)}</div>`).join("")||'<p class="mu">Noch keine Nachrichten.</p>';if(b)e.scrollTop=e.scrollHeight}
const PAL=["#7c3aed","#ec4899","#f97316","#0ea5e9","#16a34a","#eab308","#ef4444","#14b8a6"];
const col=s=>PAL[[...String(s).toLowerCase()].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const today=()=>iso(new Date());
function inDays(ds){const n=Math.round((new Date(ds+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5);return n<=0?"heute":n==1?"morgen":"in "+n+" Tagen"}
async function toggleDone(id){if(done.has(id)){done.delete(id);await sb.from("done").delete().eq("item_id",id)}else{done.add(id);const r=await sb.from("done").insert({item_id:id});if(r.error){done.delete(id);alert("Abhaken klappt noch nicht. Bitte zuerst supabase-update.sql in Supabase ausführen.")}}render()}
function itemHtml(i){const s=sols.filter(x=>x.item_id==i.id),dn=done.has(i.id);
 return `<div class="it"><span class="tag ${i.type}">${LBL[i.type]}</span><span class="${dn?"dn":""}">${esc(i.text)}</span> <i class="mu">(${esc(i.by_name)})</i>${isA()||i.user_id==me.id?` <button class="x" onclick="delItem(${i.id})" aria-label="Löschen">✕</button>`:""}
 ${i.type=="ha"?`<div><label class="chk"><input type="checkbox" ${dn?"checked":""} onchange="toggleDone(${i.id})"> erledigt</label></div>`:""}
 <div>${s.map(x=>`<span><a href="${url(x.path)}" target="_blank"><img class="ph" src="${url(x.path)}" alt="Lösung von ${esc(x.by_name)}"></a>${isA()?`<button class="x" onclick="delSol(${x.id},'${x.path}')">✕</button>`:""}</span>`).join("")}</div>
 ${i.type=="ha"?`<label class="mu" style="cursor:pointer">📷 Lösung hinzufügen<input type="file" accept="image/*" hidden onchange="addPhoto(${i.id},this.files[0])"></label>`:""}</div>`}
function dayHtml(ds){const d=wd(ds),used=new Set();let h="";
 (d<5?tt[d]:[]).forEach((s,i)=>{if(!s)return;used.add(s.toLowerCase());const it=items.filter(x=>x.date==ds&&x.subject.toLowerCase()==s.toLowerCase());
  h+=`<div class="card lesson" style="border-left:6px solid ${col(s)}"><span class="nr">${i+1}.</span><div><b style="color:${col(s)}">${esc(s)}</b>${it.map(itemHtml).join("")||'<div class="mu">–</div>'}</div></div>`});
 const rest=items.filter(x=>x.date==ds&&!used.has(x.subject.toLowerCase()));
 if(rest.length)h+=`<div class="card"><b>Weitere Einträge</b>${rest.map(i=>`<div class="mu">${esc(i.subject)}</div>`+itemHtml(i)).join("")}</div>`;
 return h||'<p class="mu">Für diesen Tag ist nichts eingetragen.</p>'}
function weekView(){const m=new Date(date+"T12:00:00");m.setDate(m.getDate()-wd(date));
 const ds=DAYS.map((_,i)=>{const x=new Date(m);x.setDate(x.getDate()+i);return iso(x)});
 let h=`<div class="row"><button onclick="shift(-7)">◀ Woche</button><b>${fmt(ds[0])} – ${fmt(ds[4])}</b><button onclick="shift(7)">Woche ▶</button></div>`;
 if(isA())h+=`<p><button onclick="edit=true;render()">Plan bearbeiten</button></p>`;
 if(!tt.some(d=>d.some(Boolean)))return h+`<p class="mu">Noch kein Stundenplan eingetragen.</p>`;
 h+=`<div class="scroll"><table style="min-width:640px"><tr><th></th>${DAYS.map((d,i)=>`<th>${d.slice(0,2)}<br><span class="mu">${ds[i].slice(8)}.${ds[i].slice(5,7)}.</span></th>`).join("")}</tr>`;
 for(let l=0;l<8;l++){if(!tt.some(d=>d[l]))continue;h+=`<tr><th>${l+1}</th>${DAYS.map((_,d)=>{const s=tt[d][l],it=s?items.filter(x=>x.date==ds[d]&&x.subject.toLowerCase()==s.toLowerCase()):[];
  return `<td style="vertical-align:top;${s?"border-top:3px solid "+col(s):""}"><b style="color:${col(s||"x")}">${esc(s)}</b>${it.map(i=>`<div class="mu"><span class="tag ${i.type}">${{ha:"HA",test:"Test",ka:"KA"}[i.type]}</span><span class="${done.has(i.id)?"dn":""}">${esc(i.text)}</span>${sols.some(x=>x.item_id==i.id)?" 📷":""}</div>`).join("")}</td>`}).join("")}</tr>`}
 return h+`</table></div>`}
function render(){const a=$("app");
 if(!me){a.innerHTML=`<header class="top"><h1>📚 Schulplaner</h1></header><div class="card"><p>Melde dich mit deinem Namen an. Beim ersten Mal auf „Neu registrieren“ tippen. Wer sich als Erstes registriert, wird Admin.</p><div class="row"><input id="nm" placeholder="Dein Name" autocomplete="username"><input id="pw" type="password" placeholder="Passwort (min. 6 Zeichen)" autocomplete="current-password"></div><p class="err">${esc(err)}</p><div class="row"><button class="p" onclick="auth(false)">Anmelden</button><button onclick="auth(true)">Neu registrieren</button></div></div>`;return}
 let h=`<header class="top"><div class="row" style="justify-content:space-between"><h1>📚 Schulplaner</h1><span style="flex:0 1 auto;font-size:.9rem">${esc(me.name)} · ${ROLES[role()]} <button onclick="logout()">Abmelden</button></span></div></header><div class="tabs">${[["morgen","🏠 Für morgen"],["tag","📅 Tag"],["plan","🗓️ Stundenplan"],["bald","⏰ Als Nächstes"],["chat","💬 Chat"]].concat(isA()?[["rollen","⚙️ Rollen"]]:[]).map(([k,n])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';render()">${n}</button>`).join("")}</div>`;
 if(tab=="morgen"){const ds=nextSchoolDay(),d=wd(ds),open=items.filter(x=>x.date==ds&&x.type=="ha"&&!done.has(x.id)).length,tests=items.filter(x=>x.date==ds&&x.type!="ha").length;
  h+=`<div class="hero"><div style="font-size:1.1rem"><b>Für morgen</b> · ${DAYS[d]}, ${fmt(ds)}</div><div>${open?`📝 ${open} Hausaufgabe${open>1?"n":""} noch offen`:"🎉 Alle Hausaufgaben erledigt"}${tests?` · ⚠️ ${tests} Test/Klassenarbeit`:""}</div></div>`+dayHtml(ds)}
 if(tab=="tag"){const d=wd(date);h+=`<div class="row"><button onclick="shift(-1)">◀</button><input type="date" value="${date}" onchange="date=this.value;render()"><button onclick="shift(1)">▶</button></div><h2>${d<5?DAYS[d]:"Wochenende"}, ${fmt(date)}</h2>`+dayHtml(date);
  if(can("ha"))h+=`<h2>Eintragen</h2><div class="card"><div class="row"><select id="typ"><option value="ha">Hausaufgabe</option>${can("test")?'<option value="test">Test</option><option value="ka">Klassenarbeit</option>':""}</select><select id="sub">${subs(d).map(s=>`<option>${esc(s)}</option>`).join("")}</select></div><textarea id="txt" rows="2" style="width:100%;margin:8px 0" placeholder="z. B. Arbeitsheft S. 315 abschreiben"></textarea><button class="p" onclick="addItem()">Speichern</button></div>`;
  else h+=`<p class="mu">Du hast nur Leserechte.</p>`}
 if(tab=="bald"){const t=today(),srt=(x,y)=>x.date<y.date?-1:1,ex=items.filter(x=>x.date>=t&&x.type!="ha").sort(srt),ho=items.filter(x=>x.date>=t&&x.type=="ha"&&!done.has(x.id)).sort(srt);
  const row=i=>`<div class="card lesson" style="border-left:6px solid ${col(i.subject)}"><div><b style="color:${col(i.subject)}">${esc(i.subject)}</b> <span class="mu">${DAYS[wd(i.date)]||"Wochenende"}, ${fmt(i.date)} · <b>${inDays(i.date)}</b></span>${itemHtml(i)}</div></div>`;
  h+=`<h2>⚠️ Tests & Klassenarbeiten</h2>${ex.map(row).join("")||'<p class="mu">Nichts in Sicht. 🎈</p>'}<h2>📝 Offene Hausaufgaben</h2>${ho.map(row).join("")||'<p class="mu">Alles erledigt. 🎉</p>'}`}
 if(tab=="plan"&&!edit)h+=weekView();
 if(tab=="plan"&&edit&&isA())h+=`<button class="p" onclick="edit=false;render()">Fertig</button><div class="card"><b>Aus VpMobil24 übernehmen</b><div class="row"><input id="kl" placeholder="Klasse, z. B. 8a" value="${esc((()=>{try{return localStorage.getItem("klasse")||""}catch(e){return""}})())}"><button class="p" onclick="importVp()" style="flex:0 0 auto">Übernehmen</button></div><p class="mu">Überschreibt die Fächer der Tage, die im Plan gefunden werden.</p></div><p class="mu">Oder Fächer direkt in die Felder tippen.</p><div class="scroll card"><table><tr><th></th>${DAYS.map(d=>`<th>${d.slice(0,2)}</th>`).join("")}</tr>${Array.from({length:8},(_,l)=>`<tr><th>${l+1}</th>${DAYS.map((_,d)=>`<td><input value="${esc(tt[d][l])}" onchange="setCell(${d},${l},this.value)"></td>`).join("")}</tr>`).join("")}</table></div>`;
 if(tab=="chat")h+=`<div class="card"><b>Klassen-Chat</b><p class="mu">Hier kannst du Fragen zu Aufgaben stellen und anderen helfen.</p><div id="ml"></div><div class="row" style="margin-top:8px"><input id="ct" placeholder="Nachricht schreiben …" onkeydown="if(event.key=='Enter')send()"><button class="p" onclick="send()" style="flex:0 0 auto">Senden</button></div></div>`;
 if(tab=="rollen"&&isA())h+=users.map(u=>`<div class="card row"><b>${esc(u.name)}</b><select onchange="setRole('${u.id}',this.value)">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role==k?"selected":""}>${v}</option>`).join("")}</select></div>`).join("");
 a.innerHTML=h;if(tab=="chat")chatList()}
init();
</script>
</body>
</html>
